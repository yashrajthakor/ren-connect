server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The main bundle is ~1 MB uncompressed — gzip matters here.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      image/svg+xml;

    # Container health check (also usable as Coolify's health check path).
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Service workers must NEVER be cached. Two are live in this app:
    #   * sw.js + registerSW.js + workbox-*.js  (vite-plugin-pwa, autoUpdate)
    #   * service-worker.js                     (legacy, registered in main.tsx)
    # A stale copy of either pins clients to an old build indefinitely.
    location ~* ^/(sw\.js|service-worker\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # index.html must revalidate so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits content-hashed filenames under /assets, so these are safe to
    # cache forever — a new build produces new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback. Every client-side route (/dashboard/..., /admin/attendance/...)
    # must serve index.html instead of 404ing on a direct visit or refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
